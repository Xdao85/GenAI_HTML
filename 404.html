<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>404 · Không tìm thấy trang / Page not found</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:"Be Vietnam Pro",system-ui,"Segoe UI",Arial,sans-serif;color:#0f172a;background:#f8fafc;text-align:center;padding:24px}
.box{max-width:560px}h1{font-size:64px;margin:0;color:#4338ca}p{font-size:19px;color:#334155;line-height:1.6}
a{display:inline-block;margin-top:10px;padding:12px 22px;border-radius:12px;background:#4338ca;color:#fff;font-weight:700;text-decoration:none}
a:focus-visible{outline:3px solid #0f172a;outline-offset:3px}
</style>
</head>
<body>
<main class="box">
<h1>404</h1>
<p>Không tìm thấy trang bạn yêu cầu.<br>The page you requested could not be found.</p>
<a href="/" id="home">Về trang chủ · Back to home</a>
</main>
<script>
// GitHub Pages project sites live under /<repo>/, so build the home link from the first path segment.
(function () { var seg = location.pathname.split('/').filter(Boolean)[0]; if (seg && location.hostname.endsWith('github.io')) document.getElementById('home').href = '/' + seg + '/'; })();
</script>
</body>
</html>
