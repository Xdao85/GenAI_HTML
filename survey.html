<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phiếu khảo sát / Questionnaire — Interactive HTML learning objects</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{--ink:#0f172a;--ink2:#334155;--mute:#64748b;--line:#e2e8f0;--bg:#f8fafc;--accent:#4338ca;--ok:#047857;--err:#b91c1c}
*{box-sizing:border-box}
body{margin:0;font-family:"Be Vietnam Pro",system-ui,"Segoe UI",Arial,sans-serif;font-size:19px;line-height:1.6;color:var(--ink);background:#f1f5f9}
main{max-width:1180px;margin:0 auto;padding:28px 20px 80px}
h1{font-size:clamp(28px,3.6vw,38px);line-height:1.25;margin:0 0 14px;letter-spacing:-.015em}
h2{font-size:25px;margin:0 0 10px;line-height:1.3}
h3{font-size:20px;margin:18px 0 8px}
a{color:var(--accent)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;font-size:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px 28px;margin:20px 0;box-shadow:0 1px 3px rgba(15,23,42,.05)}
.notice{background:#eef2ff;border:1px solid #c7d2fe;border-radius:18px;padding:18px 22px}
.notice.err{background:#fef2f2;border-color:#fecaca;color:var(--err)}
.notice.done{background:#ecfdf5;border-color:#a7f3d0}
.hint{color:var(--mute);font-size:17px;margin:0 0 12px}
.q{padding:16px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.qid{display:inline-block;font-family:Consolas,monospace;font-size:13px;font-weight:700;color:var(--mute);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-right:8px;vertical-align:2px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.scale label{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;border:1.5px solid var(--line);border-radius:14px;padding:10px 4px;cursor:pointer;font-size:14.5px;line-height:1.3;color:var(--ink2);background:#fff;transition:.12s}
.scale label b{font-size:22px;color:var(--ink)}
.scale input{position:absolute;opacity:0;pointer-events:none}
.scale label:has(input:checked){border-color:var(--accent);background:#eef2ff;box-shadow:0 0 0 2px #c7d2fe inset}
.scale label:hover{border-color:#a5b4fc}
select,input[type=text],textarea{font:inherit;font-size:18px;border:1.5px solid #cbd5e1;border-radius:12px;padding:9px 12px;background:#fff;max-width:100%}
textarea{width:100%;min-height:120px}
.multi{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:8px}
.multi label{display:flex;align-items:center;gap:8px}
input[type=checkbox]{width:20px;height:20px}
.missing{background:#fef2f2;border-radius:14px;box-shadow:0 0 0 2px #fecaca;padding-left:10px;padding-right:10px}
.btn{font:inherit;font-weight:700;font-size:19px;border-radius:14px;border:1.5px solid #cbd5e1;background:#fff;padding:12px 22px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.6;cursor:wait}
.landing{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;margin-top:18px}
.landing a{display:block;text-decoration:none;border-radius:22px;padding:26px;color:#fff;background:linear-gradient(135deg,#4338ca,#6d28d9)}
.landing a.l{background:linear-gradient(135deg,#0369a1,#0f766e)}
.landing a span{display:block;font-size:26px;font-weight:800}
.landing a small{display:block;font-size:17px;opacity:.92}
figure{margin:12px 0 0}
figure img{width:100%;height:auto;border:1px solid var(--line);border-radius:14px;cursor:zoom-in;background:#fff}
figcaption{font-size:16px;color:var(--mute);margin-top:6px}
ol.wf,ul.rules{padding-left:24px;margin:10px 0}
ol.wf li,ul.rules li{margin:6px 0}
.layers{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.layers span{font-size:15.5px;font-weight:600;border-radius:999px;padding:4px 12px;background:#eef2ff;color:#3730a3}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;margin-top:12px}
table.anch{border-collapse:collapse;width:100%;min-width:900px;font-size:15.5px;line-height:1.4}
table.anch th{position:sticky;top:0;background:#334155;color:#fff;text-align:left;padding:9px 10px;font-size:15px}
table.anch td{border-top:1px solid var(--line);padding:9px 10px;vertical-align:top}
table.anch td.c{font-weight:700;background:var(--bg);min-width:160px}
table.rate{border-collapse:collapse;width:100%;font-size:17px}
table.rate th{background:var(--bg);text-align:center;padding:10px 6px;font-size:16px;border-bottom:2px solid var(--line)}
table.rate th:first-child{text-align:left}
table.rate td{border-bottom:1px solid var(--line);padding:10px 6px;vertical-align:top}
table.rate td.s{text-align:center;width:13%}
table.rate select{font-size:19px;font-weight:700;padding:6px 8px;min-width:70px}
details{margin-top:4px;font-size:15.5px;color:var(--ink2)}
details summary{cursor:pointer;color:var(--accent);font-weight:600}
details ol{margin:6px 0 0;padding-left:0;list-style:none}
details li{margin:3px 0}
.scope{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin:10px 0}
.scope div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:16.5px}
.sticky{position:sticky;bottom:0;background:rgba(241,245,249,.94);backdrop-filter:blur(6px);padding:12px 0;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.saved{font-size:15px;color:var(--mute)}
.rprog{position:sticky;top:0;z-index:5;display:inline-block;background:#eef2ff;color:#3730a3;font-weight:700;font-size:16px;border-radius:999px;padding:6px 14px;margin:4px 0 6px}
.rcard{border:1.5px solid var(--line);border-radius:18px;padding:16px 18px;margin:14px 0;background:#fff}
.rcard.rdone{border-color:#a7f3d0;background:#f6fffb}
.rc-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:20px;margin-bottom:10px}
.rc-num{font-size:14px;color:var(--mute);font-weight:600}
.auto-tag{font-size:13px;font-weight:700;color:#047857;background:#d1fae5;border-radius:999px;padding:2px 10px}
.rgrid{display:grid;gap:6px}
.rg-row{display:grid;grid-template-columns:130px repeat(5,1fr);gap:6px;align-items:stretch}
.rg-fmt{font-weight:700;font-size:17px;display:flex;align-items:center}
.rg-top .rg-fmt{font-size:14px;color:var(--mute);font-weight:600}
.rg-lv{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 9px;font-size:14.5px;line-height:1.35;color:var(--ink2)}
.rg-lv b{display:block;font-size:17px;color:var(--ink);margin-bottom:2px}
.rg-cell{display:flex;align-items:center;justify-content:center;border:1.5px solid #cbd5e1;border-radius:12px;min-height:46px;cursor:pointer;font-weight:700;font-size:18px;color:#94a3b8;background:#fff;transition:.12s}
.rg-cell input{position:absolute;opacity:0;pointer-events:none}
.rg-cell:hover{border-color:#818cf8;color:var(--accent)}
.rg-cell:has(input:checked){background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(67,56,202,.3)}
.rg-mob{display:none}
.c10{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.c10 div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.c10 span{display:block;font-size:15px;color:var(--mute)}
.c10 b{font-size:20px}
@media (max-width:760px){.rg-top{display:none}.rg-mob{display:block}.rg-row{grid-template-columns:96px repeat(5,1fr);gap:5px}.rg-fmt{font-size:15px}.rg-cell{min-height:42px}.c10{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){body{font-size:18px}.card{padding:20px 16px}.scale label{font-size:12.5px;padding:8px 2px}.scale label b{font-size:20px}
  table.rate{font-size:15.5px}table.rate select{min-width:56px;font-size:17px}}
.lang{display:inline-flex;border:1.5px solid #cbd5e1;border-radius:999px;overflow:hidden;background:#fff}
.lang button{font:inherit;font-size:15px;font-weight:600;border:0;background:#fff;padding:5px 12px;cursor:pointer;color:var(--ink2)}
.lang button.on{background:var(--accent);color:#fff}
i.en2{display:block;font-style:italic;color:#64748b;font-size:.92em;margin-top:2px}
.scale label i.en2{font-size:12.5px;margin-top:0}
h1 i.en2{font-size:.62em;font-weight:600;margin-top:4px}h2 i.en2,h3 i.en2{font-size:.72em;font-weight:600}
.btn i.en2{color:#e0e7ff;font-size:.78em;margin:0}.landing i.en2{color:#e0e7ff}.rc-head i.en2{display:inline;margin-left:6px;font-size:.8em}
</style>
</head>
<body>
<main>
<div class="top"><a id="home" href="index.html"></a><span style="display:flex;gap:12px;align-items:center"><span id="draftInfo" class="saved"></span>
<span class="lang" id="langSw"><button data-l="vi">Tiếng Việt</button><button data-l="en">English</button><button data-l="both">VI + EN</button></span></span></div>
<div id="app"></div>
</main>
<script>
const ITEMS = {"likert": {"vi": ["Hoàn toàn không đồng ý", "Không đồng ý", "Trung lập", "Đồng ý", "Hoàn toàn đồng ý"], "en": ["Strongly disagree", "Disagree", "Neutral", "Agree", "Strongly agree"]}, "student": {"role": "student", "title": {"vi": "Phiếu khảo sát sinh viên – Học liệu HTML tương tác", "en": "Student questionnaire – Interactive HTML learning pages"}, "intro": {"vi": "Phiếu khảo sát ẩn danh, mất khoảng 10 phút. Không thu thập họ tên, mã sinh viên hay email. Việc tham gia là tự nguyện và không ảnh hưởng đến điểm học phần. Bạn có thể dừng bất cứ lúc nào. Nếu chưa dùng các trang học tập, hãy mở trang chủ và khám phá trang của học phần bạn đang học trước khi làm phiếu.", "en": "This anonymous questionnaire takes about 10 minutes. No names, student IDs or e-mail addresses are collected. Participation is voluntary and does not affect your grades. You may stop at any time. If you have not used the learning pages yet, open the home page and explore the page of your course first."}, "consent": {"vi": "Tôi đã đọc thông tin trên và đồng ý tham gia.", "en": "I have read the information above and agree to take part."}, "demographics": [{"id": "D_course", "type": "select", "title": {"vi": "Học phần bạn đang học", "en": "Course you are taking"}, "options": [["01_MAT", "Toán kỹ thuật", "Engineering Mathematics"], ["02_CIR", "Lý thuyết mạch", "Circuit Analysis"], ["03_EMF", "Trường điện từ", "Electromagnetics"], ["04_SIG", "Tín hiệu và hệ thống", "Signals and Systems"], ["05_CTL", "Điều khiển tự động", "Control Systems"], ["06_DSP", "Xử lý số tín hiệu", "Digital Signal Processing"], ["other", "Khác", "Other"]]}, {"id": "D_year", "type": "select", "title": {"vi": "Năm học", "en": "Year of study"}, "options": [["1", "Năm 1", "Year 1"], ["2", "Năm 2", "Year 2"], ["3", "Năm 3", "Year 3"], ["4", "Năm 4+", "Year 4+"]]}, {"id": "D_demos", "type": "multi", "title": {"vi": "Bạn đã dùng trang học tập nào? (chọn tất cả)", "en": "Which learning pages did you use? (select all)"}, "options": [["01_MAT", "Toán kỹ thuật", "Engineering Mathematics"], ["02_CIR", "Lý thuyết mạch", "Circuit Analysis"], ["03_EMF", "Trường điện từ", "Electromagnetics"], ["04_SIG", "Tín hiệu và hệ thống", "Signals and Systems"], ["05_CTL", "Điều khiển tự động", "Control Systems"], ["06_DSP", "Xử lý số tín hiệu", "Digital Signal Processing"]]}, {"id": "D_minutes", "type": "select", "title": {"vi": "Tổng thời gian bạn đã dùng các trang", "en": "Total time you spent on the pages"}, "options": [["lt15", "< 15 phút", "< 15 min"], ["15_30", "15–30 phút", "15–30 min"], ["30_60", "30–60 phút", "30–60 min"], ["gt60", "> 60 phút", "> 60 min"]]}, {"id": "D_device", "type": "select", "title": {"vi": "Thiết bị chủ yếu", "en": "Main device"}, "options": [["laptop", "Máy tính", "Laptop"], ["phone", "Điện thoại", "Phone"], ["tablet", "Máy tính bảng", "Tablet"]]}, {"id": "D_matlab", "type": "select", "title": {"vi": "Kinh nghiệm dùng MATLAB/Python trước đó", "en": "Prior experience with MATLAB/Python"}, "options": [["none", "Chưa từng", "None"], ["basic", "Cơ bản", "Basic"], ["good", "Khá", "Good"], ["advanced", "Thành thạo", "Advanced"]]}, {"id": "D_code", "type": "text", "title": {"vi": "Mã ẩn danh hiển thị ở cuối trang học tập (không bắt buộc)", "en": "Anonymous code shown at the bottom of the learning page (optional)"}, "options": []}], "blocks": [{"id": "SUS", "title": {"vi": "A. Khả năng sử dụng (SUS)", "en": "A. Usability (System Usability Scale)"}, "note": {"vi": "“Trang học tập” là các trang HTML bạn đã dùng.", "en": "“Learning page” refers to the HTML pages you used."}, "items": [{"id": "SUS1", "text": {"vi": "Tôi nghĩ rằng tôi muốn sử dụng trang học tập này thường xuyên.", "en": "I think that I would like to use this learning page frequently."}}, {"id": "SUS2", "text": {"vi": "Tôi thấy trang học tập này phức tạp một cách không cần thiết.", "en": "I found this learning page unnecessarily complex."}}, {"id": "SUS3", "text": {"vi": "Tôi thấy trang học tập này dễ sử dụng.", "en": "I thought this learning page was easy to use."}}, {"id": "SUS4", "text": {"vi": "Tôi nghĩ rằng tôi cần sự hỗ trợ của người có chuyên môn kỹ thuật để dùng được trang học tập này.", "en": "I think that I would need the support of a technical person to be able to use this learning page."}}, {"id": "SUS5", "text": {"vi": "Tôi thấy các chức năng khác nhau của trang được tích hợp tốt với nhau.", "en": "I found the various functions in this learning page were well integrated."}}, {"id": "SUS6", "text": {"vi": "Tôi thấy trang học tập này có quá nhiều điểm thiếu nhất quán.", "en": "I thought there was too much inconsistency in this learning page."}}, {"id": "SUS7", "text": {"vi": "Tôi nghĩ hầu hết mọi người sẽ học cách dùng trang này rất nhanh.", "en": "I would imagine that most people would learn to use this learning page very quickly."}}, {"id": "SUS8", "text": {"vi": "Tôi thấy trang học tập này rất rườm rà, khó thao tác.", "en": "I found this learning page very cumbersome to use."}}, {"id": "SUS9", "text": {"vi": "Tôi cảm thấy rất tự tin khi sử dụng trang học tập này.", "en": "I felt very confident using this learning page."}}, {"id": "SUS10", "text": {"vi": "Tôi cần học nhiều thứ trước khi có thể bắt đầu dùng trang học tập này.", "en": "I needed to learn a lot of things before I could get going with this learning page."}}]}, {"id": "SI", "title": {"vi": "B. Mức độ tích hợp", "en": "B. Perceived integration"}, "note": {"vi": "", "en": ""}, "items": [{"id": "SI1", "text": {"vi": "Có lời giải thích, công thức, mô phỏng và câu hỏi trên cùng một trang giúp tôi không phải chuyển qua lại giữa nhiều tệp.", "en": "Having the explanation, equations, simulation, and questions on one page saved me from switching between files."}}, {"id": "SI2", "text": {"vi": "Tôi dễ dàng thấy được mối liên hệ giữa công thức và mô phỏng.", "en": "I could easily see how the equations related to the simulation."}}, {"id": "SI3", "text": {"vi": "Trang này kết nối lý thuyết với kết quả tính toán tốt hơn so với slide, PDF và tệp MATLAB riêng rẽ.", "en": "The page connected theory and numerical results better than separate slides, PDF, and MATLAB files."}}, {"id": "SI4", "text": {"vi": "Tôi hiếm khi bị lạc khi theo dõi nội dung của chủ đề.", "en": "I rarely lost track of where I was in the topic."}}]}, {"id": "SL", "title": {"vi": "C. Hỗ trợ học tập", "en": "C. Perceived learning support"}, "note": {"vi": "", "en": ""}, "items": [{"id": "SL1", "text": {"vi": "Việc thay đổi tham số giúp tôi hiểu hệ thống hoạt động như thế nào.", "en": "Changing parameters helped me understand how the system behaves."}}, {"id": "SL2", "text": {"vi": "Trang này giúp tôi hiểu ý nghĩa của các công thức.", "en": "The page helped me understand the meaning of the equations."}}, {"id": "SL3", "text": {"vi": "Phản hồi của bài trắc nghiệm giúp tôi sửa những chỗ hiểu sai.", "en": "The quiz feedback helped me correct my misunderstandings."}}, {"id": "SL4", "text": {"vi": "Tôi tự tin hơn khi giải bài tập về chủ đề này.", "en": "I feel more confident solving problems on this topic."}}]}, {"id": "SE", "title": {"vi": "D. Hứng thú và tương tác", "en": "D. Engagement and interactivity"}, "note": {"vi": "", "en": ""}, "items": [{"id": "SE1", "text": {"vi": "Tôi muốn thử nhiều giá trị tham số khác nhau.", "en": "I wanted to try different parameter values."}}, {"id": "SE2", "text": {"vi": "Các thành phần tương tác giúp tôi tập trung.", "en": "The interactive elements kept me engaged."}}, {"id": "SE3", "text": {"vi": "Tôi sẽ dùng những trang như thế này để tự học.", "en": "I would use pages like this for self-study."}}]}, {"id": "ST", "title": {"vi": "E. Độ tin cậy của mô phỏng", "en": "E. Trust in simulation"}, "note": {"vi": "", "en": ""}, "items": [{"id": "ST1", "text": {"vi": "Ô kiểm chứng (ĐẠT/KHÔNG ĐẠT) làm tôi tin vào kết quả mô phỏng.", "en": "The validation panel (PASS/FAIL) made me trust the simulation results."}}, {"id": "ST2", "text": {"vi": "Việc so sánh mô phỏng với nghiệm chính xác là hữu ích.", "en": "Seeing the simulation compared with the exact solution was useful."}}, {"id": "ST3", "text": {"vi": "Tôi hiểu vì sao mô phỏng không đạt khi bước tính quá lớn.", "en": "I understood why a simulation fails when the step size is too large."}}]}, {"id": "SP", "title": {"vi": "F. Mức độ ưa thích", "en": "F. Preference"}, "note": {"vi": "", "en": ""}, "items": [{"id": "SP1", "text": {"vi": "Tôi thích trang tích hợp này hơn so với slide, PDF và tệp MATLAB riêng rẽ.", "en": "I prefer this integrated page to separate slides, PDF, and MATLAB files."}}, {"id": "SP2", "text": {"vi": "Tôi muốn nhiều chủ đề trong học phần được dạy theo cách này.", "en": "I would like more topics in my courses to be delivered this way."}}]}], "open": [{"id": "O1", "text": {"vi": "Điều gì giúp bạn nhiều nhất?", "en": "What helped you most?"}}, {"id": "O2", "text": {"vi": "Điều gì gây khó hiểu hoặc còn thiếu?", "en": "What was confusing or missing?"}}]}, "lecturer": {"role": "lecturer", "title": {"vi": "Phiếu khảo sát giảng viên – Học liệu HTML tích hợp với hỗ trợ của AI tạo sinh", "en": "Lecturer questionnaire – GenAI-assisted integrated HTML learning objects"}, "intro": {"vi": "Trước khi trả lời, vui lòng xem ít nhất hai trang demo thuộc chuyên môn của bạn. Sơ đồ quy trình và bảng rubric cần cho việc trả lời đều có ngay trong phiếu này, bạn không cần đọc bài báo. Phiếu ẩn danh, mất khoảng 20–30 phút; câu trả lời được lưu tạm trên trình duyệt nên có thể làm tiếp nếu lỡ đóng trang.", "en": "Before answering, please look at at least two demonstrators in your field. The workflow diagram and the rubric you need are included in this questionnaire, so you do not need to read the paper. The questionnaire is anonymous and takes about 20–30 minutes; answers are kept in your browser, so you can continue if you close the page."}, "consent": {"vi": "Tôi đồng ý tham gia và cho phép sử dụng câu trả lời ẩn danh cho mục đích nghiên cứu.", "en": "I agree to take part and allow my anonymous answers to be used for research."}, "demographics": [{"id": "D_years", "type": "select", "title": {"vi": "Số năm giảng dạy", "en": "Years of teaching"}, "options": [["lt5", "< 5", "< 5"], ["5_10", "5–10", "5–10"], ["10_20", "10–20", "10–20"], ["gt20", "> 20", "> 20"]]}, {"id": "D_area", "type": "multi", "title": {"vi": "Lĩnh vực giảng dạy (chọn tất cả)", "en": "Teaching areas (select all)"}, "options": [["01_MAT", "Toán kỹ thuật", "Engineering Mathematics"], ["02_CIR", "Lý thuyết mạch", "Circuit Analysis"], ["03_EMF", "Trường điện từ", "Electromagnetics"], ["04_SIG", "Tín hiệu và hệ thống", "Signals and Systems"], ["05_CTL", "Điều khiển tự động", "Control Systems"], ["06_DSP", "Xử lý số tín hiệu", "Digital Signal Processing"], ["other", "Khác", "Other"]]}, {"id": "D_genai", "type": "select", "title": {"vi": "Mức độ dùng AI tạo sinh (ChatGPT, Claude…) trong công việc", "en": "Use of generative AI (ChatGPT, Claude…) in your work"}, "options": [["never", "Chưa từng", "Never"], ["occasional", "Thỉnh thoảng", "Occasionally"], ["weekly", "Hàng tuần", "Weekly"], ["daily", "Hàng ngày", "Daily"]]}, {"id": "D_web", "type": "select", "title": {"vi": "Kỹ năng lập trình web (HTML/JavaScript)", "en": "Web programming skills (HTML/JavaScript)"}, "options": [["none", "Không có", "None"], ["basic", "Cơ bản", "Basic"], ["good", "Khá", "Good"], ["advanced", "Thành thạo", "Advanced"]]}, {"id": "D_tools", "type": "multi", "title": {"vi": "Công cụ bạn đang dùng để soạn học liệu", "en": "Tools you currently use to prepare materials"}, "options": [["PPTX", "PowerPoint", "PowerPoint"], ["LATEX", "LaTeX", "LaTeX"], ["MATLAB", "MATLAB / Live Script", "MATLAB / Live Script"], ["JUPYTER", "Jupyter / Python", "Jupyter / Python"], ["HTML", "HTML / web", "HTML / web"], ["LMS", "LMS (Moodle…)", "LMS (Moodle…)"]]}], "blocks": [{"id": "LU", "title": {"vi": "A. Mức hữu ích", "en": "A. Perceived usefulness"}, "note": {"vi": "", "en": ""}, "items": [{"id": "LU1", "text": {"vi": "Các trang HTML tích hợp sẽ nâng cao chất lượng học liệu của tôi.", "en": "Integrated HTML pages would improve the quality of my teaching materials."}}, {"id": "LU2", "text": {"vi": "Chúng sẽ giúp sinh viên liên kết lý thuyết, toán học và mô phỏng.", "en": "They would help my students connect theory, mathematics, and simulation."}}, {"id": "LU3", "text": {"vi": "Chúng sẽ hữu ích cho việc tự học ngoài giờ lên lớp.", "en": "They would be useful for self-study outside class."}}, {"id": "LU4", "text": {"vi": "Nhìn chung, cách tiếp cận này hữu ích cho các học phần của tôi.", "en": "Overall, the approach is useful for my courses."}}]}, {"id": "LE", "title": {"vi": "B. Mức dễ áp dụng", "en": "B. Perceived ease of adoption"}, "note": {"vi": "", "en": ""}, "items": [{"id": "LE1", "text": {"vi": "Quy trình trong Hình 1 rõ ràng với tôi.", "en": "The workflow in Fig. 1 is clear to me."}}, {"id": "LE2", "text": {"vi": "Tôi có thể thực hiện quy trình này với sự hỗ trợ của AI tạo sinh.", "en": "I could follow the workflow with GenAI assistance."}}, {"id": "LE3", "text": {"vi": "Phân phối một tệp HTML duy nhất cho sinh viên là dễ dàng.", "en": "Distributing a single HTML file to students is easy."}}, {"id": "LE4", "text": {"vi": "Áp dụng cách tiếp cận này không đòi hỏi kỹ năng mà tôi không thể học được.", "en": "Adopting the approach would not require skills I cannot acquire."}}]}, {"id": "LD", "title": {"vi": "C. Công sức phát triển với AI tạo sinh (theo cảm nhận)", "en": "C. Perceived development effort with GenAI"}, "note": {"vi": "", "en": ""}, "items": [{"id": "LD1", "text": {"vi": "Với AI tạo sinh, xây dựng một trang như các demo sẽ tốn thời gian ở mức chấp nhận được.", "en": "With GenAI, building a page like the demonstrators would take an acceptable amount of my time."}}, {"id": "LD2", "text": {"vi": "AI tạo sinh sẽ giảm đáng kể phần lập trình tôi phải tự làm.", "en": "GenAI would substantially reduce the programming I would have to do myself."}}, {"id": "LD3", "text": {"vi": "Nếu không có AI tạo sinh, xây dựng một trang như vậy sẽ quá tốn thời gian đối với tôi.", "en": "Building such a page without GenAI would be too time-consuming for me."}}, {"id": "LD4", "text": {"vi": "Bước kiểm chứng làm tăng khối lượng công việc ở mức chấp nhận được.", "en": "The verification step adds an acceptable amount of extra work."}}]}, {"id": "LM", "title": {"vi": "D. Khả năng bảo trì", "en": "D. Perceived maintainability"}, "note": {"vi": "", "en": ""}, "items": [{"id": "LM1", "text": {"vi": "Cập nhật một trang (ví dụ thêm tham số hoặc câu hỏi) với AI tạo sinh là làm được.", "en": "Updating a page (e.g., adding a parameter or question) with GenAI would be manageable."}}, {"id": "LM2", "text": {"vi": "Một tệp HTML duy nhất dễ cập nhật hơn so với slide, PDF và script riêng rẽ.", "en": "A single HTML file is easier to keep up to date than separate slides, PDF, and scripts."}}, {"id": "LM3", "text": {"vi": "Tôi lo ngại về việc bảo trì các trang khi trình duyệt và thư viện thay đổi.", "en": "I am concerned about maintaining the pages as browsers and libraries change."}}]}, {"id": "LT", "title": {"vi": "E. Độ tin cậy và kiểm chứng", "en": "E. Trust and verification"}, "note": {"vi": "", "en": ""}, "items": [{"id": "LT1", "text": {"vi": "So sánh mô phỏng với tham chiếu giải tích và MATLAB làm tôi tin vào mã do AI tạo sinh viết.", "en": "Comparing simulations with analytical and MATLAB references makes me trust GenAI-generated code."}}, {"id": "LT2", "text": {"vi": "Ngưỡng sai số 1% là phù hợp cho mục đích giảng dạy.", "en": "The tolerance of 1% is appropriate for teaching purposes."}}, {"id": "LT3", "text": {"vi": "Tôi sẽ không phát hành mô phỏng do AI tạo sinh viết nếu chưa qua các bước kiểm tra như vậy.", "en": "I would not release a GenAI-generated simulation without such checks."}}]}, {"id": "LI", "title": {"vi": "F. Ý định sử dụng", "en": "F. Intention to use"}, "note": {"vi": "", "en": ""}, "items": [{"id": "LI1", "text": {"vi": "Tôi dự định thử trang HTML tích hợp trong ít nhất một học phần của mình.", "en": "I intend to try integrated HTML pages in at least one of my courses."}}, {"id": "LI2", "text": {"vi": "Tôi sẽ giới thiệu cách tiếp cận này cho đồng nghiệp.", "en": "I would recommend the approach to colleagues."}}]}], "open": [{"id": "O1", "text": {"vi": "Điều gì có thể cản trở bạn áp dụng cách tiếp cận này?", "en": "What would prevent you from adopting this approach?"}}, {"id": "O2", "text": {"vi": "Những chủ đề nào trong học phần của bạn sẽ được lợi nhiều nhất?", "en": "Which topics in your courses would benefit most?"}}]}, "rubric": {"formats": [["PPTX", "PPTX"], ["LATEX", "LaTeX/PDF"], ["MATLAB", "MATLAB"], ["HTML", "HTML"]], "levels": {"vi": ["1 – Rất hạn chế", "2 – Hạn chế", "3 – Đạt yêu cầu", "4 – Tốt", "5 – Xuất sắc"], "en": ["1 – Very limited", "2 – Limited", "3 – Adequate", "4 – Good", "5 – Excellent"]}, "criteria": [{"id": "C1", "name": {"vi": "Tổ chức nội dung", "en": "Content organization"}, "levels": {"vi": ["Không có cấu trúc; không có trình tự hay điều hướng", "Chỉ có trình tự tuyến tính", "Có các mục với tiêu đề; điều hướng thủ công", "Cấu trúc phân cấp có điều hướng (mục lục, liên kết)", "Như mức 4, thêm tham chiếu chéo tự động đến công thức và hình"], "en": ["Unstructured; no sequence or navigation", "Linear sequence only", "Sections with headings; manual navigation", "Hierarchical structure with navigation (contents, links)", "Level 4 plus automatic cross-referencing of equations and figures"]}}, {"id": "C2", "name": {"vi": "Biểu diễn toán học", "en": "Mathematical representation"}, "levels": {"vi": ["Công thức dạng ảnh hoặc văn bản thường", "Ký hiệu trong dòng; không có công thức có cấu trúc", "Trình soạn công thức có cấu trúc; đánh số, căn chỉnh hạn chế", "Cú pháp LaTeX đầy đủ, có căn chỉnh và đánh số; hạn chế nhỏ khi in", "Dàn trang chất lượng xuất bản: đánh số, căn chỉnh, tham chiếu chéo, in chính xác"], "en": ["Equations as images or plain text", "Inline symbols; no structured equations", "Structured equation editor; limited numbering/alignment", "Full LaTeX syntax incl. alignment and numbering; minor print limits", "Publication-quality typesetting, numbering, alignment, cross-references, print fidelity"]}}, {"id": "C3", "name": {"vi": "Trực quan hóa tĩnh", "en": "Static visualization"}, "levels": {"vi": ["Chỉ có văn bản", "Chỉ có ảnh chèn từ ngoài", "Sơ đồ tự vẽ <i>hoặc</i> đồ thị tự tạo", "Có cả sơ đồ và đồ thị tự tạo; dữ liệu nhập tay hoặc định dạng hạn chế", "Sơ đồ vectơ và đồ thị sinh từ dữ liệu, chất lượng xuất bản"], "en": ["Text only", "Imported images only", "Native diagrams <i>or</i> native plots", "Native diagrams and plots; manual data or limited styling", "Native vector diagrams and data-driven plots at publication quality"]}}, {"id": "C4", "name": {"vi": "Trực quan hóa tương tác", "en": "Interactive visualization"}, "levels": {"vi": ["Không có", "Hiệu ứng soạn sẵn (trình tự cố định)", "Duyệt các trạng thái tính sẵn (phóng to, xoay, chuyển khung)", "Người học đổi tham số; hình được tính lại sau khi chạy lại", "Người học đổi tham số; hình cập nhật liên tục theo thời gian thực"], "en": ["None", "Pre-authored animations or triggers (fixed sequence)", "Navigation of pre-computed states (zoom, rotate, frames)", "Learner changes parameters; view recomputed after re-execution", "Learner changes parameters; view updated continuously in real time"]}}, {"id": "C5", "name": {"vi": "Trực quan hóa 3D", "en": "3D visualization"}, "levels": {"vi": ["Không có", "Hình chiếu 3D tĩnh (góc nhìn cố định)", "Vật thể 3D xoay được, không gắn với dữ liệu hay mô hình", "Đồ thị 3D tương tác sinh từ dữ liệu (mặt, trường vectơ)", "Như mức 4, thêm dữ liệu lớn (≥ 10<sup>5</sup> phần tử), cắt lớp, công cụ khối"], "en": ["None", "Static 3D projection (fixed viewpoint)", "Rotatable 3D objects not coupled to data or models", "Interactive data-driven 3D plots (surfaces, vector fields)", "Level 4 plus large datasets (≥ 10<sup>5</sup> elements), slicing, volumetric tools"]}}, {"id": "C6", "name": {"vi": "Mô phỏng số", "en": "Numerical simulation"}, "levels": {"vi": ["Không có", "Kết quả tính sẵn nhập từ công cụ khác", "Tự chạy mô hình đơn giản (dạng đóng, bước lặp hiện)", "Tự chạy phương pháp tổng quát (PTVP, FFT, đại số tuyến tính), độ chính xác kép", "Thư viện giải đã kiểm chứng và toolbox (bộ giải PTVP, điều khiển, xử lý tín hiệu)"], "en": ["None", "Pre-computed results imported from another tool", "Native execution of simple models (closed form, explicit stepping)", "Native general methods (ODE, FFT, linear algebra) in double precision", "Validated solver libraries and toolboxes (ODE suites, control, signal processing)"]}}, {"id": "C7", "name": {"vi": "Tương tác tham số", "en": "Parameter interaction"}, "levels": {"vi": ["Không đổi được tham số", "Chọn trong các trường hợp định sẵn", "Đổi bằng cách sửa mã nguồn rồi chạy lại", "Đổi qua điều khiển giao diện, phải chạy lại", "Điều khiển giao diện, phản hồi tức thì, có kiểm tra miền giá trị"], "en": ["No parameter change possible", "Selection among predefined cases", "Change by editing source code and re-running", "Change through GUI controls with re-execution", "GUI controls with immediate response and input-range checking"]}}, {"id": "C8", "name": {"vi": "Tích hợp đánh giá", "en": "Assessment integration"}, "levels": {"vi": ["Không có đánh giá", "Câu hỏi tĩnh; đáp án cung cấp riêng", "Tự kiểm tra (xem đáp án, phản hồi qua liên kết)", "Câu hỏi tự chấm nhúng sẵn (trắc nghiệm, số có sai số cho phép), phản hồi ngay", "Như mức 4, thêm câu hỏi tham số hóa hoặc dựa trên mô phỏng, gửi điểm về LMS"], "en": ["No assessment", "Static questions; answers supplied separately", "Self-check (reveal answer, hyperlinked feedback)", "Embedded auto-scored items (MCQ, numeric with tolerance), immediate feedback", "Level 4 plus parameterized or simulation-based items and LMS score reporting"]}}, {"id": "C9", "name": {"vi": "Truy cập đa nền tảng", "en": "Cross-platform accessibility"}, "levels": {"vi": ["Phần mềm có bản quyền trên một hệ điều hành", "Phần mềm bản quyền hoặc tài khoản của trường (nhiều hệ điều hành)", "Trình xem miễn phí; giảm chức năng trên một số nền tảng", "Trình xem miễn phí, phổ biến; đầy đủ trên máy tính, giảm trên di động", "Trình duyệt/trình xem chuẩn; đầy đủ chức năng trên máy tính và di động"], "en": ["Licensed software on one OS", "Licensed software or institutional account (multi-OS)", "Free viewer; functionality reduced on some platforms", "Free ubiquitous viewer; full on desktop, reduced on mobile", "Standard browser/viewer; full functionality on desktop and mobile"]}}, {"id": "C10", "name": {"vi": "Tích hợp nội dung (suy ra)", "en": "Content integration (derived)"}, "levels": {"vi": ["≤ 1 trong 5 lớp", "2 lớp", "3 lớp", "4 lớp", "Cả 5 lớp trong một sản phẩm"], "en": ["≤ 1 of the five layers", "2 layers", "3 layers", "4 layers", "All 5 layers in one artifact"]}}, {"id": "C11", "name": {"vi": "Dễ cập nhật", "en": "Ease of updating"}, "levels": {"vi": ["Phải làm lại từ đầu", "Sửa phối hợp nhiều tệp/công cụ rồi xuất lại", "Sửa một nguồn rồi biên dịch lại; cần kỹ năng chuyên môn", "Giảng viên chuyên ngành tự sửa một nguồn văn bản; tự động dựng lại", "Như mức 4, thêm kiểm tra tự động xác nhận tính đúng sau khi sửa"], "en": ["Rebuild from scratch", "Coordinated edits across several files/tools and re-export", "Edits in one source plus rebuild; specialist skill needed", "Edits in one text source by a domain instructor; automatic rebuild", "Level 4 plus automated checks confirm correctness after change"]}}, {"id": "C12", "name": {"vi": "Yêu cầu soạn thảo (đảo chiều: điểm cao = dễ)", "en": "Authoring demand (reverse-coded)"}, "levels": {"vi": ["≥ 3 ngôn ngữ và kỹ năng gỡ lỗi chuyên sâu", "2–3 ngôn ngữ (vd. HTML, CSS, JavaScript) và kỹ năng web", "Hiểu biết làm việc (viết hoặc đọc) một ngôn ngữ", "Một ngôn ngữ ở mức cơ bản, hoặc trình soạn thảo có chút lệnh", "Chỉ soạn thảo trực quan (WYSIWYG); không lập trình"], "en": ["≥ 3 languages and specialist debugging skills", "2–3 languages (e.g., HTML, CSS, JavaScript) and web skills", "Working knowledge (writing or reviewing) of one language", "One language at basic level, or editor with light scripting", "WYSIWYG authoring only; no programming"]}}], "rules": [{"vi": "<b>Phạm vi.</b> Chấm năng lực vốn có của mỗi định dạng như thường dùng trong giảng dạy: PPTX không cài thêm add-in; LaTeX ở dạng PDF đã biên dịch, mở bằng trình đọc thông thường; MATLAB ở dạng script và Live Script (không tính ứng dụng App Designer đã đóng gói); HTML là một trang độc lập dùng thư viện mở.", "en": "<b>Scope.</b> Rate the native capability of each format as typically used in teaching: PPTX without add-ins; LaTeX as a compiled PDF in a standard reader; MATLAB as scripts and Live Scripts (not compiled App Designer apps); HTML as a self-contained page using open libraries."}, {"vi": "<b>Chỉ cho một mức khi có đủ mọi đặc điểm của mức đó.</b> Nếu phân vân giữa hai mức, chọn mức thấp hơn.", "en": "<b>Award a level only if all of its features are present.</b> If in doubt between two levels, choose the lower one."}, {"vi": "<b>C10 được suy ra, không chấm theo cảm nhận.</b> Năm lớp là: trình bày (C1), toán học (C2), trực quan hóa (C3), mô phỏng (C6), đánh giá (C8). C10 = số tiêu chí trong năm tiêu chí này đạt từ 3 điểm trở lên (≤ 1 lớp → 1; 5 lớp → 5).", "en": "<b>C10 is computed, not judged.</b> The five layers are presentation (C1), mathematics (C2), visualization (C3), simulation (C6) and assessment (C8). C10 = number of these criteria rated 3 or higher (≤ 1 layer → 1; 5 layers → 5)."}, {"vi": "<b>C12 đảo chiều:</b> điểm cao nghĩa là yêu cầu soạn thảo thấp (dễ soạn).", "en": "<b>C12 is reverse-coded:</b> a high score means low authoring demand (easy to author)."}, {"vi": "<b>Không cộng tổng.</b> Các tiêu chí không cùng thang đo và có phần chồng lấn (C4 và C7 cùng liên quan đến tương tác), nên không tính điểm tổng.", "en": "<b>No total score.</b> The criteria are not commensurable and partly overlap (C4 and C7 both concern interaction), so no total is computed."}], "scope": {"PPTX": {"vi": "PowerPoint, không cài thêm add-in.", "en": "PowerPoint without add-ins."}, "LATEX": {"vi": "Tệp PDF đã biên dịch, mở bằng trình đọc thông thường.", "en": "Compiled PDF in a standard reader."}, "MATLAB": {"vi": "Script và Live Script (không tính ứng dụng App Designer đã đóng gói).", "en": "Scripts and Live Scripts (not compiled App Designer apps)."}, "HTML": {"vi": "Trang HTML độc lập dùng thư viện mở (như các trang demo).", "en": "Self-contained HTML page with open libraries (like the demonstrators)."}}}};
</script>

const rid = () => Array.from(crypto.getRandomValues(new Uint8Array(6))).map(b => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[b % 32]).join('');
const ls = {get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} }};

const store = () => { try { return JSON.parse(ls.get(STORE) || '[]'); } catch (e) { return []; } };
const saveLocal = r => { const a = store(); a.push(r); ls.set(STORE, JSON.stringify(a)); };

// ---------------- language ----------------

// html text: o = {vi, en}; raw = true when the strings already contain trusted HTML
const T = (o, raw) => { if (typeof o === 'string') return raw ? o : esc(o); const f = x => raw ? x : esc(x);
  return LANG === 'vi' ? f(o.vi) : LANG === 'en' ? f(o.en) : `${f(o.vi)}<i class="en2">${f(o.en)}</i>`; };
// plain text (option labels, attributes)
const P = o => typeof o === 'string' ? o : LANG === 'vi' ? o.vi : LANG === 'en' ? o.en : (o.vi === o.en ? o.vi : `${o.vi} / ${o.en}`);
const U = {
  home: {vi: '← Trang chủ (6 trang học tập)', en: '← Home (six learning pages)'},
  choose: {vi: 'Chọn phiếu khảo sát', en: 'Choose your questionnaire'},
  anon: {vi: 'Phiếu ẩn danh, không thu thập họ tên, mã sinh viên, email hay địa chỉ IP.', en: 'Anonymous: no names, student IDs, e-mail or IP addresses are collected.'},
  stu: {vi: 'Sinh viên', en: 'Students'}, lec: {vi: 'Giảng viên', en: 'Lecturers'},

  scale: {vi: 'Thang điểm cho các câu dưới đây', en: 'Scale for the items below'},

  send: {vi: 'Gửi câu trả lời', en: 'Submit'}, sending: {vi: 'Đang gửi…', en: 'Sending…'},
  temp: {vi: 'Câu trả lời được lưu tạm trên trình duyệt này cho tới khi gửi.', en: 'Your answers are kept in this browser until you submit.'},
  restored: {vi: 'Đã khôi phục phần đang làm dở.', en: 'Your unfinished answers were restored.'},
  saved: {vi: 'Đã lưu tạm ', en: 'Saved '},
  miss: {vi: n => `Còn ${n} câu chưa trả lời (được tô đỏ). Vui lòng hoàn thành rồi bấm Gửi lại.`, en: n => `${n} item(s) not answered (highlighted in red). Please complete them and submit again.`},

  noep: {vi: 'Trang chưa được cấu hình địa chỉ thu thập. Vui lòng tải tệp CSV dưới đây và gửi cho người phụ trách khảo sát.', en: 'No collection address is configured. Please download the CSV below and send it to the survey administrator.'},
  rid: {vi: 'Mã phản hồi', en: 'Response ID'}, dl: {vi: 'Tải câu trả lời (CSV)', en: 'Download my answers (CSV)'}, back: {vi: 'Về trang chủ', en: 'Back to home'}
};
const tu = k => T(U[k]);

// ---------------- lecturer-only content ----------------
const WF = {
  h: {vi: 'Quy trình đề xuất (Hình 1)', en: 'Proposed workflow (Figure 1)'},
  hint: {vi: 'Phần này tóm tắt cách các trang demo được xây dựng, để bạn trả lời các câu hỏi về mức hữu ích, công sức, bảo trì và độ tin cậy.', en: 'This section summarises how the demonstrators were built, so that you can answer the questions on usefulness, effort, maintenance and trust.'},
  cap: {vi: 'Hình 1. Quy trình đề xuất (bấm vào hình để xem kích thước đầy đủ).', en: 'Figure 1. Proposed workflow (click to enlarge).'},
  steps: [
    {vi: '<b>Học liệu hiện có:</b> bài giảng PPTX, suy dẫn LaTeX, mô hình và kết quả MATLAB.', en: '<b>Existing materials:</b> PPTX lectures, LaTeX derivations, MATLAB models and results.'},
    {vi: '<b>Phát triển với AI tạo sinh (S1–S5):</b> chuyển nội dung slide thành các mục có cấu trúc (S1); chuyển công thức LaTeX sang MathJax (S2); lập trình đồ họa SVG/Canvas/Three.js (S3); chuyển mô phỏng MATLAB sang JavaScript (S4); soạn câu hỏi đánh giá có phản hồi và sai số cho phép (S5).', en: '<b>GenAI-assisted development (S1–S5):</b> slides to structured sections (S1); LaTeX to MathJax (S2); SVG/Canvas/Three.js visualization code (S3); MATLAB simulations translated to JavaScript (S4); assessment items with feedback and tolerances (S5).'},
    {vi: '<b>Học liệu HTML tích hợp:</b> một trang duy nhất có năm lớp — ① trình bày, ② toán học, ③ trực quan hóa, ④ mô phỏng, ⑤ đánh giá.', en: '<b>Integrated HTML learning object:</b> one page with five layers — ① presentation, ② mathematics, ③ visualization, ④ simulation, ⑤ assessment.'},
    {vi: '<b>Kiểm chứng (tiêu chí hoàn thành):</b> so sánh với lời giải giải tích và kết quả MATLAB (sai số tương đối hoặc NRMSE ≤ 1 %; 2 % với FDTD), giảng viên thẩm định toán, vật lý và sư phạm, kiểm tra kỹ thuật trên các trình duyệt. Chưa đạt thì quay lại S1–S5. Kết quả kiểm chứng hiển thị ngay trên trang (ô PASS/FAIL).', en: '<b>Verification (definition of done):</b> comparison with analytical solutions and MATLAB results (relative error or NRMSE ≤ 1 %; 2 % for FDTD), instructor review of mathematics, physics and pedagogy, and technical checks in several browsers. Failures go back to S1–S5. The verification result is shown on each page (PASS/FAIL panel).'},
    {vi: '<b>Sử dụng và đánh giá:</b> triển khai trên mọi trình duyệt/thiết bị; sinh viên khám phá và tự đánh giá; khảo sát sinh viên, giảng viên và chấm rubric (chính là phiếu này).', en: '<b>Use and evaluation:</b> deployment on any browser or device; students explore and self-assess; student and lecturer surveys and rubric ratings (this questionnaire).'}],
  note: {vi: 'Lưu ý: giảng viên luôn tham gia (đặt mục tiêu, viết prompt, đọc mã, phê duyệt); MATLAB vừa là nguồn mô hình vừa là tham chiếu tính toán; các thay đổi về sau đi lại qua cùng quy trình (vòng bảo trì). Mỗi trang demo có sẵn đoạn mã MATLAB tham chiếu.', en: 'Note: the instructor stays in the loop (objectives, prompts, code reading, approval); MATLAB is both the source of the models and the computational reference; later changes go through the same workflow (maintenance loop). Each demonstrator includes its MATLAB reference script.'},
  open: {vi: 'Mở 6 trang demo trong thẻ mới →', en: 'Open the six demonstrators in a new tab →'}
};

  return `<h2>${T(WF.h)}</h2><p class="hint">${T(WF.hint)}</p>
    <figure><a href="${img}" target="_blank" rel="noopener"><img src="${img}" alt="${esc(P(WF.h))}"></a><figcaption>${T(WF.cap)}</figcaption></figure>
    <ol class="wf">${WF.steps.map(s => `<li>${T(s, true)}</li>`).join('')}</ol>
    <p class="hint" style="margin-top:12px">${T(WF.note)}</p>

}
const RG = {
  h: {vi: 'G. Hướng dẫn chấm rubric (Bảng 4)', en: 'G. Rubric guide (Table 4)'},
  hint: {vi: 'Bạn sẽ chấm 4 định dạng theo 12 tiêu chí, mỗi tiêu chí 1–5 điểm. Mỗi mức có mô tả cụ thể để việc chấm dựa trên đặc điểm quan sát được.', en: 'You will rate 4 formats on 12 criteria, each from 1 to 5. Every level has an explicit description so that ratings rest on observable features.'},
  tab: {vi: 'Bảng 4. Rubric có mô tả mức (1–5)', en: 'Table 4. Anchored rubric (1–5)'},
  crit: {vi: 'Tiêu chí', en: 'Criterion'},
  swipe: {vi: 'Trên điện thoại, vuốt ngang để xem đủ bảng. Ở phần chấm bên dưới, mỗi tiêu chí có nút “Xem mô tả 5 mức”.', en: 'On a phone, swipe sideways to see the whole table. In the rating section, each criterion has a “Show the 5 levels” button.'},
  rh: {vi: 'H. Chấm điểm 4 định dạng theo 12 tiêu chí (1–5)', en: 'H. Rate the 4 formats on the 12 criteria (1–5)'},
  rhint: {vi: 'Mỗi thẻ là một tiêu chí. Đọc mô tả của 5 mức ở hàng trên, rồi với mỗi định dạng (PPTX, LaTeX/PDF, MATLAB, HTML) <b>bấm vào ô của mức mô tả đúng nhất</b>. Chỉ chọn một mức khi định dạng có đủ các đặc điểm của mức đó; nếu phân vân, chọn mức thấp hơn. C10 được tính tự động; C12 đảo chiều (điểm cao = dễ soạn).',
          en: 'Each card is one criterion. Read the five level descriptions in the top row, then for each format (PPTX, LaTeX/PDF, MATLAB, HTML) <b>click the cell of the level that fits best</b>. Award a level only if the format has all of its features; if in doubt, choose the lower level. C10 is computed automatically; C12 is reverse-coded (higher = easier to author).'},

  c10: {vi: 'Không cần chấm: C10 = số lớp nội dung có trong một sản phẩm, được tính tự động từ điểm C1 (trình bày), C2 (toán học), C3 (trực quan hóa), C6 (mô phỏng) và C8 (đánh giá) mà bạn đã chấm; tiêu chí nào từ 3 điểm trở lên được tính là một lớp (≤ 1 lớp → 1 điểm; 5 lớp → 5 điểm).',
        en: 'No rating needed: C10 = number of content layers in one artifact, computed from your ratings of C1 (presentation), C2 (mathematics), C3 (visualization), C6 (simulation) and C8 (assessment); a criterion rated 3 or higher counts as one layer (≤ 1 layer → 1; 5 layers → 5).'},
  layers: {vi: 'lớp', en: 'layers'}

function rubricGuide() {

  return `<h2>${T(RG.h)}</h2><p class="hint">${T(RG.hint)}</p>

      ${R.criteria.map(c => `<tr><td class="c">${c.id}<br>${T(c.name, true)}</td>${[0,1,2,3,4].map(i => `<td>${T({vi: c.levels.vi[i], en: c.levels.en[i]}, true)}</td>`).join('')}</tr>`).join('')}
    </tbody></table></div><p class="hint" style="margin-top:8px">${T(RG.swipe)}</p>`;
}
function rubricRate() {
  const R = ITEMS.rubric, F = R.formats;
  const card = (c, k) => {
    const head = `<div class="rc-head"><span class="rc-num">${k + 1}/12</span><span class="qid">${c.id}</span><b>${T(c.name, true)}</b>${c.id === 'C10' ? `<span class="auto-tag">${T(RG.auto)}</span>` : ''}</div>`;
    if (c.id === 'C10') return `<div class="rcard" data-req="LR_C10">${head}<p class="hint">${T(RG.c10)}</p>
      <div class="c10">${F.map(f => `<div><span>${esc(f[1])}</span><b id="c10_${f[0]}">–</b><input type="hidden" name="LR_${f[0]}_C10" value=""></div>`).join('')}</div></div>`;
    const lv = i => ({vi: c.levels.vi[i], en: c.levels.en[i]});
    return `<div class="rcard" data-req="LR_${c.id}">${head}
      <div class="rgrid"><div class="rg-row rg-top"><div class="rg-fmt">${T(RG.lvl)}</div>${[0,1,2,3,4].map(i => `<div class="rg-lv"><b>${i + 1}</b><span>${T(lv(i), true)}</span></div>`).join('')}</div>
        ${F.map(f => `<div class="rg-row"><div class="rg-fmt">${esc(f[1])}</div>${[1,2,3,4,5].map(v => `<label class="rg-cell" title="${esc(f[1])} – ${v}"><input type="radio" name="LR_${f[0]}_${c.id}" value="${v}"><span>${v}</span></label>`).join('')}</div>`).join('')}</div>
      <details class="rg-mob"><summary>${T(RG.show)}</summary><ol>${[0,1,2,3,4].map(i => `<li><b>${i + 1}</b> – ${T(lv(i), true)}</li>`).join('')}</ol></details></div>`;
  };
  return `<h2>${T(RG.rh)}</h2><p class="hint">${T(RG.rhint, true)}</p><div class="rprog" id="rprog"></div>${R.criteria.map(card).join('')}`;
}
function rubricWire(form) {
  const F = ITEMS.rubric.formats, SRC = ['C1', 'C2', 'C3', 'C6', 'C8'];
  const upd = () => {
    F.forEach(f => {
      const v = SRC.map(c => (form.querySelector(`input[name="LR_${f[0]}_${c}"]:checked`) || {}).value);
      const h = form.querySelector(`input[name="LR_${f[0]}_C10"]`), out = document.getElementById('c10_' + f[0]);
      if (v.every(Boolean)) { const n = v.filter(x => +x >= 3).length, sc = Math.max(1, n); h.value = sc; out.textContent = `${sc} (${n} ${P(RG.layers)})`; }
      else { h.value = ''; out.textContent = '–'; }
    });
    const done = form.querySelectorAll('.rgrid input:checked').length;
    document.getElementById('rprog').textContent = (LANG === 'en' ? RG.prog.en(done) : RG.prog.vi(done)) + (done === 44 ? ' ✓' : '');
    form.querySelectorAll('.rcard').forEach(cd => { const id = cd.dataset.req.slice(3); if (id === 'C10') return;
      cd.classList.toggle('rdone', F.every(f => form.querySelector(`input[name="LR_${f[0]}_${id}"]:checked`))); });
  };
  form.addEventListener('change', e => { if (e.target.name && e.target.name.startsWith('LR_')) upd(); });
  upd();
}

// ---------------- CSV ----------------
function columns(role) {
  const def = ITEMS[role], cols = ['study', 'role', 'response_id', 'submitted_at', 'duration_s', 'cohort', 'ui_lang'];
  def.demographics.forEach(d => cols.push(d.id));
  def.blocks.forEach(b => b.items.forEach(i => cols.push(i.id)));
  if (role === 'lecturer') ITEMS.rubric.criteria.forEach(c => ITEMS.rubric.formats.forEach(f => cols.push(`LR_${f[0]}_${c.id}`)));
  def.open.forEach(o => cols.push(o.id));
  return cols;
}
function toCSV(rows, cols) {
  const q = v => { v = v === undefined || v === null ? '' : String(v); return /[",\n;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  return '﻿' + [cols.join(','), ...rows.map(r => cols.map(c => q(r[c])).join(','))].join('\n');
}
function download(name, text) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type: 'text/csv'})); a.download = name; a.click(); }

// ---------------- pages ----------------
function landing() {
  $('#app').innerHTML = `<div class="card"><h1>${tu('choose')}</h1><p class="hint">${tu('anon')}</p>
    <div class="landing"><a href="?role=student&lang=${LANG}"><span>${tu('stu')}</span><small>${tu('stuD')}</small></a>
    <a class="l" href="?role=lecturer&lang=${LANG}"><span>${tu('lec')}</span><small>${tu('lecD')}</small></a></div></div>`;
}
let T0 = Date.now();
function render(role) {
  const def = ITEMS[role], L = ITEMS.likert, DRAFT = 'survey_draft_' + STUDY_ID + '_' + role;
  const code = params.get('code') || ls.get('p2_anon_code') || '';
  const lk = i => ({vi: L.vi[i], en: L.en[i]});
  const likert = it => `<div class="q" data-req="${it.id}"><div><span class="qid">${it.id}</span>${T(it.text)}</div>
    <div class="scale">${[1,2,3,4,5].map(v => `<label><input type="radio" name="${it.id}" value="${v}"><b>${v}</b>${T(lk(v - 1))}</label>`).join('')}</div></div>`;
  const demo = d => {
    const head = `<div><span class="qid">${d.id}</span>${T(d.title)}</div>`;
    if (d.type === 'select') return `<div class="q">${head}<select name="${d.id}"><option value="">${esc(P(U.pick))}</option>${d.options.map(o => `<option value="${esc(o[0])}">${esc(P({vi: o[1], en: o[2]}))}</option>`).join('')}</select></div>`;
    if (d.type === 'multi') return `<div class="q">${head}<div class="multi">${d.options.map(o => `<label><input type="checkbox" name="${d.id}" value="${esc(o[0])}"> ${esc(P({vi: o[1], en: o[2]}))}</label>`).join('')}</div></div>`;
    return `<div class="q">${head}<p class="hint">${tu('code')}</p><input type="text" name="${d.id}" maxlength="20" value="${esc(code)}"></div>`;
  };
  let html = `<div class="card"><h1>${T(def.title)}</h1><div class="notice">${T(def.intro)}</div>
    <p style="margin-top:16px"><label style="display:flex;gap:12px;align-items:flex-start"><input type="checkbox" id="consent" style="margin-top:6px"> <span>${T(def.consent)}</span></label></p></div>
    <form id="f" autocomplete="off" style="display:none">
    <div class="card"><h2>${tu('bg')}</h2><p class="hint">${tu('opt')}</p>${def.demographics.map(demo).join('')}</div>`;
  if (role === 'lecturer') html += `<div class="card">${workflowHTML()}</div>`;
  html += `<div class="card"><p class="hint" style="margin:0">${tu('scale')}: ${[0,1,2,3,4].map(i => `<b>${i + 1}</b> = ${esc(P(lk(i)))}`).join(' · ')}.</p></div>`;
  def.blocks.forEach(b => { html += `<div class="card"><h2>${T(b.title)}</h2>${b.note && b.note.vi ? `<p class="hint">${T(b.note)}</p>` : ''}${b.items.map(likert).join('')}</div>`; });
  if (role === 'lecturer') html += `<div class="card">${rubricGuide()}</div><div class="card">${rubricRate()}</div>`;
  html += `<div class="card"><h2>${tu('open')}</h2>${def.open.map(o => `<div class="q"><div><span class="qid">${o.id}</span>${T(o.text)}</div><textarea name="${o.id}" maxlength="3000"></textarea></div>`).join('')}</div>
    <div id="msg"></div><div class="sticky"><button class="btn primary" type="submit" id="send">${tu('send')}</button><span class="saved">${tu('temp')}</span></div></form>`;
  $('#app').innerHTML = html;
  const form = $('#f');
  $('#consent').onchange = e => { form.style.display = e.target.checked ? '' : 'none'; };
  const collect = () => { const fd = new FormData(form), r = {}; for (const k of new Set(fd.keys())) r[k] = fd.getAll(k).join(';'); return r; };
  window.__saveDraft = () => { if ($('#consent') && $('#consent').checked) ls.set(DRAFT, JSON.stringify(collect())); };
  let d = null; try { d = JSON.parse(ls.get(DRAFT) || 'null'); } catch (e) {}
  if (d) { Object.entries(d).forEach(([k, v]) => form.querySelectorAll(`[name="${k}"]`).forEach(el => {
      if (el.type === 'radio' || el.type === 'checkbox') el.checked = String(v).split(';').includes(el.value); else el.value = v; }));
    $('#consent').checked = true; form.style.display = ''; $('#draftInfo').textContent = P(U.restored); }
  if (role === 'lecturer') rubricWire(form);
  let tm = null; form.addEventListener('input', () => { clearTimeout(tm); tm = setTimeout(() => { window.__saveDraft(); $('#draftInfo').textContent = P(U.saved) + new Date().toLocaleTimeString(LANG === 'en' ? 'en-GB' : 'vi-VN'); }, 400); });
  form.onsubmit = async ev => {
    ev.preventDefault();
    const r = Object.assign({study: STUDY_ID, role, response_id: rid(), submitted_at: new Date().toISOString(), duration_s: Math.round((Date.now() - T0) / 1000), cohort: params.get('cohort') || '', ui_lang: LANG}, collect());
    document.querySelectorAll('.missing').forEach(e => e.classList.remove('missing'));
    const missing = [];
    def.blocks.forEach(b => b.items.forEach(i => { if (!r[i.id]) { missing.push(i.id); document.querySelector(`[data-req="${i.id}"]`).classList.add('missing'); } }));
    if (role === 'lecturer') ITEMS.rubric.criteria.forEach(c => { if (ITEMS.rubric.formats.some(f => !r[`LR_${f[0]}_${c.id}`])) { missing.push('LR_' + c.id); document.querySelector(`[data-req="LR_${c.id}"]`).classList.add('missing'); } });
    if (missing.length) { $('#msg').innerHTML = `<div class="notice err">${LANG === 'en' ? U.miss.en(missing.length) : U.miss.vi(missing.length) + (LANG === 'both' ? `<i class="en2">${U.miss.en(missing.length)}</i>` : '')}</div>`;
      document.querySelector('.missing').scrollIntoView({behavior: 'smooth', block: 'center'}); return; }
    $('#send').disabled = true; $('#send').textContent = P(U.sending);
    saveLocal(r);
    let sent = false;
    if (ENDPOINT) { try { await fetch(ENDPOINT, {method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify({type: 'survey_' + role, data: r})}); sent = true; } catch (e) { sent = false; } }
    ls.del(DRAFT); window.__saveDraft = () => {}; $('#draftInfo').textContent = '';
    $('#app').innerHTML = `<div class="card notice done"><h2>${tu('thanks')}</h2><p>${tu(sent ? 'sent' : (ENDPOINT ? 'neterr' : 'noep'))}</p>
      <p>${tu('rid')}: <span class="qid" style="font-size:16px">${r.response_id}</span></p>
      <p><button class="btn" id="dl">${tu('dl')}</button> <a class="btn" href="index.html?lang=${LANG}" style="text-decoration:none">${tu('back')}</a></p></div>`;
    $('#dl').onclick = () => download(`${role}_${r.response_id}.csv`, toCSV([r], columns(role)));
    scrollTo(0, 0);
  };
}
function admin() {
  const all = store(), by = role => all.filter(r => r.role === role);
  $('#app').innerHTML = `<div class="card"><h1>Chế độ quản trị / Admin</h1><p>${all.length} phiếu / responses stored in this browser.</p>
    <p><button class="btn" id="dS">Sinh viên / Students (${by('student').length})</button> <button class="btn" id="dL">Giảng viên / Lecturers (${by('lecturer').length})</button> <button class="btn" id="clr">Xóa / Clear</button></p>
    <p class="hint">ENDPOINT (config.js): ${ENDPOINT ? esc(ENDPOINT) : '<b>—</b>'}</p></div>`;
  $('#dS').onclick = () => download('students_all.csv', toCSV(by('student'), columns('student')));
  $('#dL').onclick = () => download('lecturers_all.csv', toCSV(by('lecturer'), columns('lecturer')));
  $('#clr').onclick = () => { if (confirm('Delete all stored responses on this device? / Xóa toàn bộ?')) { ls.del(STORE); admin(); } };
}
function route() {
  document.documentElement.lang = LANG === 'en' ? 'en' : 'vi';
  $('#home').textContent = P(U.home); $('#home').href = 'index.html?lang=' + LANG;
  document.querySelectorAll('#langSw button').forEach(b => b.classList.toggle('on', b.dataset.l === LANG));
  const role = params.get('role');
  if (params.get('admin') === '1') admin();
  else if (role === 'student' || role === 'lecturer') render(role);
  else landing();
}
document.querySelectorAll('#langSw button').forEach(b => b.onclick = () => {
  if (window.__saveDraft) window.__saveDraft();
  LANG = b.dataset.l; ls.set('p2_lang', LANG); params.set('lang', LANG);
  history.replaceState(null, '', '?' + params.toString());
  const y = scrollY; route(); scrollTo(0, y);
});
route();

</script>
</body>
